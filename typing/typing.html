<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">  
    <title>Скорость печати</title>
    <link rel="stylesheet" href="style_typing.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <div class="wrapper">
      <input type="text" class="input-field" autofocus>
      <div class="content-box">
        <div class="typing-text">
          <p>Загрузка текста...</p>
        </div>
        <div class="content">
          <ul class="result-details">
            <li class="time">
              <p>Осталось времени:</p>
              <span><b>60</b> сек</span>
            </li>
            <li class="mistake">
              <p>Ошибки:</p>
              <span>0</span>
            </li>
            <li class="wpm">
              <p>Слов в минуту:</p>
              <span>0</span>
            </li>
            <li class="cpm">
              <p>Символов в минуту:</p>
              <span>0</span>
            </li>
          </ul>
          <button>Попробовать снова</button>
        </div>
      </div>
    </div>

    <script src="paragraphs.js"></script>
    <script src="typing_script.js"></script>
  </body>
</html>
